# PhoneBuddy workspace root
#
# A high-energy LLM Agent engine library for mobile (iOS / Android).
# Dependency trimming notes (for iOS/Android cross-compilation constraints):
#   - rustls uses the ring backend (reqwest `rustls-tls` is __rustls-ring in 0.12)
#   - tokio without the `process` feature (fork is banned on iOS); replaced by
#     built-in busybox applets + the embedded JS engine
#   - no jemalloc / git2 / rusqlite / tree-sitter / gcloud-storage / tonic
#   - everything is pure Rust or a mature C cross-compilation dependency
#     (ring / boa are pure Rust)

[workspace]
resolver = "2"
members = [
    "crates/phone-buddy",
    "crates/phone-buddy-ffi",
    "crates/phone-buddy-cli",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.4"
authors = ["PhoneBuddy SDK Contributors"]
rust-version = "1.94"

[workspace.dependencies]
phone-buddy = { path = "crates/phone-buddy" }

# ---- HTTP / LLM ----
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
    "http2",
] }
eventsource-stream = "0.2"
async-stream = "0.3"
async-trait = "0.1"
futures-util = "0.3"
futures = "0.3"
bytes = "1"
url = "2"
# rustls is only used to install the ring CryptoProvider explicitly at engine
# initialization (iOS/Android cross-compilation friendly)
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }

# ---- async runtime (no process feature) ----
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "net",
] }
tokio-util = "0.7"

# ---- serde / data ----
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4"] }
base64 = "0.22"

# ---- text / file search (pure Rust) ----
regex = "1"
globset = "0.4"
ignore = "0.4"
walkdir = "2"
encoding_rs = "0.8"
infer = "0.19"
# HTML → Markdown (web_fetch; pure Rust, same as grok-build)
htmd = "0.5"

# ---- Office documents (pure Rust) ----
calamine = { version = "0.26", default-features = false }
csv = "1"
quick-xml = "0.36"

# ---- embedded JS engine (pure Rust) ----
boa_engine = "0.20"

# ---- misc ----
sha2 = "0.10"
# tracing: release_max_level_off strips all tracing format strings at compile time in release builds
tracing = { version = "0.1", default-features = false, features = ["std", "release_max_level_off"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "registry"] }
tracing-android = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "z"
strip = true

# iOS static library distribution profile: keep line numbers for symbolication
[profile.ios-dist]
inherits = "release"
opt-level = 3
strip = false
debug = "line-tables-only"

[profile.dev]
panic = "unwind"
debug = "line-tables-only"
