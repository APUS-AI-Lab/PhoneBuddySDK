[package]
name = "phone-buddy-ffi"
description = "C ABI FFI layer for PhoneBuddy SDK: cdylib/staticlib for iOS (Swift/ObjC++) and Android (JNI/Kotlin) integration."
license.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "phone_buddy_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
phone-buddy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.28"
cc = "1.0"
